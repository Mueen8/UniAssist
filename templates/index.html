<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UniAssist - University AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #070B14;
            color: #F8FAFC;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        .header {
            height: 72px;
            background: #0D1424;
            border-bottom: 1px solid #1E293B;
            display: flex;
            align-items: center;
            padding: 0 24px;
            flex-shrink: 0;
        }

        .logo {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: #2563EB;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-right: 12px;
        }

        .brand h1 {
            font-size: 21px;
            margin-bottom: 3px;
        }

        .brand p {
            color: #94A3B8;
            font-size: 12px;
        }

        /* CHAT */

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 25px 18px;
        }

        .message-row {
            display: flex;
            margin-bottom: 18px;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.bot {
            justify-content: flex-start;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 9px;
            flex-shrink: 0;
        }

        .bubble {
            max-width: min(680px, 80%);
            padding: 13px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .bot .bubble {
            background: #111827;
            border: 1px solid #1E293B;
            border-top-left-radius: 5px;
        }

        .user .bubble {
            background: #2563EB;
            border-top-right-radius: 5px;
        }

        /* INPUT */

        .input-area {
            background: #0D1424;
            border-top: 1px solid #1E293B;
            padding: 15px 18px;
            flex-shrink: 0;
        }

        .input-box {
            max-width: 900px;
            margin: auto;
            display: flex;
            gap: 10px;
        }

        #question {
            flex: 1;
            height: 50px;
            background: #111827;
            color: #F8FAFC;
            border: 1px solid #1E293B;
            border-radius: 14px;
            outline: none;
            padding: 0 16px;
            font-size: 14px;
        }

        #question:focus {
            border-color: #2563EB;
        }

        #question::placeholder {
            color: #94A3B8;
        }

        #send {
            width: 52px;
            height: 50px;
            border: none;
            border-radius: 14px;
            background: #2563EB;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        #send:hover {
            background: #1D4ED8;
        }

        #send:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .typing {
            color: #94A3B8;
            font-size: 13px;
            padding: 5px 0;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .header {
                height: 65px;
                padding: 0 15px;
            }

            .logo {
                width: 40px;
                height: 40px;
            }

            .brand h1 {
                font-size: 18px;
            }

            .chat {
                padding: 18px 12px;
            }

            .bubble {
                max-width: 85%;
                font-size: 13px;
            }

            .input-area {
                padding: 10px;
            }

            #question {
                height: 46px;
            }

            #send {
                width: 48px;
                height: 46px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            🤖
        </div>

        <div class="brand">
            <h1>UniAssist</h1>
            <p>University AI Assistant</p>
        </div>

    </header>


    <!-- CHAT AREA -->

    <main class="chat" id="chat">

        <div class="message-row bot">

            <div class="avatar">
                🤖
            </div>

            <div class="bubble">
Assalam-o-Alaikum! 👋

Main UniAssist hoon, aapka University AI Assistant.

Aap students, CGPA, percentage, roll number, timetable, teachers aur university information ke baare mein mujhse pooch sakte hain.
            </div>

        </div>

    </main>


    <!-- INPUT -->

    <footer class="input-area">

        <div class="input-box">

            <input
                type="text"
                id="question"
                placeholder="Ask UniAssist anything..."
                autocomplete="off"
            >

            <button id="send">
                ➤
            </button>

        </div>

    </footer>

</div>


<script>

    const questionInput = document.getElementById("question");
    const sendButton = document.getElementById("send");
    const chat = document.getElementById("chat");


    function addUserMessage(message) {

        const row = document.createElement("div");

        row.className = "message-row user";

        const bubble = document.createElement("div");

        bubble.className = "bubble";

        bubble.textContent = message;

        row.appendChild(bubble);

        chat.appendChild(row);

        scrollToBottom();
    }


    function addBotMessage(message) {

        const row = document.createElement("div");

        row.className = "message-row bot";

        const avatar = document.createElement("div");

        avatar.className = "avatar";

        avatar.textContent = "🤖";

        const bubble = document.createElement("div");

        bubble.className = "bubble";

        bubble.textContent = message;

        row.appendChild(avatar);

        row.appendChild(bubble);

        chat.appendChild(row);

        scrollToBottom();
    }


    function scrollToBottom() {

        chat.scrollTop = chat.scrollHeight;
    }


    async function sendMessage() {

        const question = questionInput.value.trim();

        if (!question) {
            return;
        }

        addUserMessage(question);

        questionInput.value = "";

        sendButton.disabled = true;

        try {

            const response = await fetch("/ask", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    question: question
                })

            });


            const data = await response.json();

            addBotMessage(
                data.answer || "Sorry, mujhe answer nahi mila."
            );


        } catch (error) {

            addBotMessage(
                "Server se connection nahi ho saka."
            );

        }

        sendButton.disabled = false;

        questionInput.focus();
    }


    sendButton.addEventListener(
        "click",
        sendMessage
    );


    questionInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                sendMessage();
            }

        }
    );


    questionInput.focus();

</script>

</body>
</html>
